@if (filters()) {
  <div class="filters" role="group" aria-label="Filter gallery by category">
    @for (c of categories(); track c) {
      <button type="button" [class.active]="category() === c" [attr.aria-pressed]="category() === c" (click)="category.set(c)">
        {{ c }}
      </button>
    }
  </div>
}

<ul class="grid" role="list">
  @for (img of visible(); track img.src; let i = $index) {
    <li [appReveal]="(i % 4) * 70 + 'ms'">
      <button type="button" class="tile" (click)="open(i)" [attr.aria-label]="'View larger: ' + img.alt">
        <img [src]="img.src" [alt]="img.alt" [width]="img.width" [height]="img.height" loading="lazy" decoding="async" />
        <span class="overlay" aria-hidden="true">
          <span class="cat">{{ img.category }}</span>
          <app-icon name="expand" size="1.1rem" />
        </span>
      </button>
    </li>
  }
</ul>

<dialog
  #dialog
  class="lightbox"
  aria-label="Image preview"
  (close)="onClosed()"
  (click)="onDialogClick($event)"
  (keydown)="onKey($event)"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  @if (currentImage(); as img) {
    <figure>
      <img [src]="img.src" [alt]="img.alt" [width]="img.width" [height]="img.height" />
      <figcaption>
        {{ img.alt }} <span class="counter">{{ (current() ?? 0) + 1 }} / {{ visible().length }}</span>
      </figcaption>
    </figure>
    <button type="button" class="lb-btn close" (click)="close()" aria-label="Close preview"><app-icon name="close" /></button>
    @if (visible().length > 1) {
      <button type="button" class="lb-btn prev" (click)="step(-1)" aria-label="Previous image"><app-icon name="prev" /></button>
      <button type="button" class="lb-btn next" (click)="step(1)" aria-label="Next image"><app-icon name="next" /></button>
    }
  }
</dialog>
